<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>なにふぁむ応援タスク</title>
<style>
  body {
    margin: 0;
    padding: 20px 0;
    background: #f4f4f5;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    display: flex;
    justify-content: center;
  }
  .container {
    width: 480px;
    max-width: 92vw;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(80, 80, 90, 0.15);
    overflow: hidden;
  }
  .header {
    background: transparent;
    color: #27272a;
    text-align: center;
    padding: 22px 16px;
  }
  .header h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 0.5px;
  }
  .header p {
    margin: 6px 0 0;
    font-size: 12px;
    opacity: 0.9;
  }
  .content {
    padding: 20px;
  }
  .intro-note {
    background: #f4f4f5;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 15px;
    color: #27272a;
    text-align: center;
    margin-bottom: 16px;
  }
  .freq-badge {
    display: inline-block;
    font-size: 13px;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 20px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .freq-daily {
    background: #3f3f46;
    color: #fff;
  }
  .freq-once {
    background: #d4d4d8;
    color: #3f3f46;
  }
  .task-card {
    background: #fafafa;
    border: 1px solid #e4e4e7;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .task-title {
    display: flex;
    align-items: center;
    font-size: 15px;
    font-weight: bold;
    color: #27272a;
    margin-bottom: 6px;
  }
  .task-title::before {
    content: "🎬";
    margin-right: 6px;
  }
  .task-note {
    font-size: 15px;
    color: #3f3f46;
    margin: 0 0 10px;
    line-height: 1.6;
  }
  .task-note .note-row {
    line-height: 1.6;
    margin-bottom: 2px;
  }
  .task-note .note-row .note-text {
    display: inline;
  }
  .checkin-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 2px 8px 2px 4px;
    border: 1px solid #e4e4e7;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    color: #1e3a5f;
    vertical-align: middle;
  }
  .checkin-badge svg {
    width: 15px;
    height: 15px;
  }
  .fan-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 12px;
    background: #f7931e;
    color: #fff;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
    vertical-align: middle;
    margin-left: 4px;
  }
  .fan-badge svg {
    width: 14px;
    height: 14px;
  }
  .icon-plain-badge {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    font-size: 11px;
    vertical-align: middle;
    margin-left: 4px;
  }
  .icon-plain-badge svg {
    width: 16px;
    height: 16px;
  }
  .icon-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 22px;
    border-radius: 4px;
    background: linear-gradient(180deg, #a3a34a, #8a8a3d);
    vertical-align: middle;
    margin-left: 4px;
  }
  .icon-badge svg {
    width: 16px;
    height: 16px;
  }
  .task-note .note-label {
    display: inline-block;
    width: 6.5em;
  }
  .task-note .highlight {
    color: #27272a;
    font-weight: bold;
  }
  .task-note .emphasis-red {
    color: #dc2626;
    font-weight: bold;
  }
  a.link-btn {
    display: block;
    text-decoration: none;
    background: #71717a;
    color: #fff;
    text-align: center;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 17px;
    font-weight: bold;
    margin-top: 8px;
    transition: background 0.2s;
  }
  a.link-btn:hover {
    background: #3f3f46;
  }
  a.link-btn.color-purple {
    background: transparent;
    border: 2px solid #9333ea;
    color: #9333ea;
  }
  a.link-btn.color-purple:hover {
    background: #f3e8ff;
  }
  a.link-btn.color-red {
    background: transparent;
    border: 2px solid #dc2626;
    color: #dc2626;
  }
  a.link-btn.color-red:hover {
    background: #fee2e2;
  }
  a.link-btn.color-pink {
    background: transparent;
    border: 2px solid #ec4899;
    color: #ec4899;
  }
  a.link-btn.color-pink:hover {
    background: #fce7f3;
  }
  a.link-btn.color-green {
    background: transparent;
    border: 2px solid #16a34a;
    color: #16a34a;
  }
  a.link-btn.color-green:hover {
    background: #dcfce7;
  }
  a.link-btn.group-start {
    margin-top: 18px;
  }
  .link-label {
    font-size: 14px;
    color: #52525b;
    margin-top: 10px;
    margin-bottom: 2px;
  }
  .footer-note {
    font-size: 13px;
    color: #71717a;
    text-align: center;
    margin-top: 18px;
    line-height: 1.6;
  }
  .checklist {
    font-size: 14px;
    color: #52525b;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>なにふぁむ応援タスク</h1>
    <p>映画版</p>
  </div>
  <div class="content">

    <div class="intro-note">まずは無料の会員登録をお願いします</div>

    <div class="task-card">

      <a class="link-btn color-purple" href="https://eiga.com/person/301960/" target="_blank" rel="noopener">高橋恭平</a>

      <a class="link-btn color-red group-start" href="https://eiga.com/movie/105416/" target="_blank" rel="noopener">時給三〇〇円の死神</a>

      <a class="link-btn color-red" href="https://eiga.com/person/295521/" target="_blank" rel="noopener">西畑大吾</a>

      <a class="link-btn color-pink group-start" href="https://eiga.com/movie/105584/" target="_blank" rel="noopener">うるわしの宵の月</a>

      <a class="link-btn color-pink" href="https://eiga.com/person/301958/" target="_blank" rel="noopener">道枝駿佑</a>

      <a class="link-btn color-green group-start" href="https://eiga.com/movie/106264/" target="_blank" rel="noopener">人生を変えたコント</a>

      <a class="link-btn color-green" href="https://eiga.com/person/295519/" target="_blank" rel="noopener">大橋和也</a>
    </div>

    <div class="footer-note">
      ※非公式のファン制作画像です
    </div>

  </div>
</div>
</body>
</html>
