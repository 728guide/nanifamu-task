<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>なにふぁむ応援タスク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 20px 0;
    background: #f4f4f5;
    font-family: "M PLUS Rounded 1c", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    display: flex;
    justify-content: center;
  }
  .container {
    width: 480px;
    max-width: 92vw;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(80, 80, 90, 0.15);
    overflow: hidden;
  }
  .header {
    text-align: center;
    padding: 22px 16px 0;
    color: #27272a;
  }
  .header h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 0.5px;
  }
  .content {
    padding: 20px;
  }
  .notice-card {
    background: #fafafa;
    border: 1px solid #e4e4e7;
    border-radius: 12px;
    padding: 20px 16px;
    text-align: center;
  }
  .notice-title {
    font-size: 17px;
    font-weight: bold;
    color: #27272a;
    margin: 0 0 12px;
  }
  .notice-text {
    font-size: 15px;
    color: #3f3f46;
    line-height: 1.7;
    margin: 0 0 18px;
  }
  a.link-btn {
    display: block;
    text-decoration: none;
    background: transparent;
    border: 2px solid #52525b;
    color: #27272a;
    text-align: center;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 17px;
    font-weight: bold;
    transition: background 0.2s;
  }
  a.link-btn:hover {
    background: #e4e4e7;
  }
  .footer-note {
    font-size: 13px;
    color: #71717a;
    text-align: center;
    margin-top: 18px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>なにふぁむ応援タスク</h1>
  </div>
  <div class="content">

    <div class="notice-card">
      <p class="notice-title">映画版は新しいURLに移動しました</p>
      <p class="notice-text">下のボタンから新しいページを開いてください。<br>ホーム画面に追加している方は、お手数ですが新しいページで追加し直してください。</p>
      <a class="link-btn" href="https://728guide.github.io/nanifamu-task/movie.html">映画版はこちら</a>
    </div>

    <div class="footer-note">
      ※非公式のファン制作画像です
    </div>

  </div>
</div>
</body>
</html>
